name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Xcode mais recente instalado
        run: |
          ls /Applications | grep -i xcode
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Usando $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Resolve simulador de iPhone disponível
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone" | grep -v unavailable | head -1 | grep -oE "[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}" | head -1)
          echo "Simulador: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build & Test
        run: |
          xcodebuild test \
            -project Pokedex/Pokedex.xcodeproj \
            -scheme Pokedex \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            | xcbeautify
        shell: bash

  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint lint --reporter github-actions-logging Pokedex/
